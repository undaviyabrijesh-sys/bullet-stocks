name: Streamlit UI validation

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/streamlit-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Validate Streamlit import and app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import streamlit, yfinance, pandas; print('UI dependencies import successfully')"
