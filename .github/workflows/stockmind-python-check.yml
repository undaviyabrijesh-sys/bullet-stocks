name: StockMind Python checks

on:
  push:
    branches:
      - stockmind-telegram-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r stockmind_telegram_mvp/requirements.txt
      - name: Compile application modules
        run: python -m compileall -q stockmind_telegram_mvp/app
      - name: Run overlay tests
        run: python -m unittest discover -s stockmind_telegram_mvp/tests -v
