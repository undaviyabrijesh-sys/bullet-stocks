name: Salty Trades Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID GitHub Actions secret.")

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": "🧂 Salty Trades connected! Telegram alerts are ready for testing."
              },
              timeout=20,
          )
          try:
              result = response.json()
          except ValueError:
              raise SystemExit(f"Telegram returned HTTP {response.status_code} with a non-JSON response.")

          if not response.ok or not result.get("ok"):
              # Telegram's description is safe to print; never print the token.
              raise SystemExit(
                  f"Telegram API error (HTTP {response.status_code}): "
                  f"{result.get('description', 'Unknown error')}"
              )
          print("Telegram test message sent successfully.")
          PY
