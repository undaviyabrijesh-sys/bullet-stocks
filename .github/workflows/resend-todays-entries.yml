name: One-time Telegram entry resend

on:
  push:
    branches:
      - telegram-resend-2026-11-05
    paths:
      - .github/workflows/resend-todays-entries.yml

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out saved entry state
        uses: actions/checkout@v4

      - name: Send today's three execution-only entry alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram configuration missing: token_present=%s chat_id_present=%s" %
                               (bool(token), bool(chat_id)))

          with open("state.json", encoding="utf-8") as handle:
              state = json.load(handle)

          symbols = ["DIVISLAB", "ANANDRATHI", "ETERNAL"]
          positions = state.get("positions", {})
          section_heads = {"TARGET LEVELS", "EXIT PLAN", "STOP LOSS UPDATED"}

          def fmt(value):
              return "₹{:,.2f}".format(float(value))

          def post_message(text, destination):
              payload = json.dumps({
                  "chat_id": destination,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      return json.loads(response.read().decode("utf-8")), None
              except urllib.error.HTTPError as exc:
                  try:
                      detail = json.loads(exc.read().decode("utf-8", errors="replace"))
                  except Exception:
                      detail = {"description": "HTTP " + str(exc.code)}
                  migrated = detail.get("parameters", {}).get("migrate_to_chat_id")
                  if migrated is not None:
                      return None, ("migrate", str(migrated))
                  return None, ("error", f"HTTP {exc.code}: {detail.get('description', 'Telegram request failed')}")
              except Exception as exc:
                  return None, ("error", f"{type(exc).__name__}: {exc}")

          failures = []
          for symbol in symbols:
              pos = positions.get(symbol)
              if not pos or not str(pos.get("opened", "")).startswith("2026-11-05"):
                  failures.append(symbol + ": missing saved position dated 2026-11-05")
                  continue

              message_text = (
                  f"🟢 {symbol} — ENTRY TRIGGERED\n\n"
                  f"Entry: {fmt(pos['entry'])}\n"
                  f"Initial SL: {fmt(pos['initial_sl'])}\n\n"
                  f"TARGET LEVELS\n"
                  f"🎯 T1: {fmt(pos['t1'])} (+25%)\n"
                  f"🎯 T2: {fmt(pos['t2'])} (+40%)\n"
                  f"🎯 T3: {fmt(pos['t3'])} (+50%)\n\n"
                  f"EXIT PLAN\n"
                  f"• T1: Book 25% of original quantity\n"
                  f"• T2: Move SL to cost and activate monthly SMA10 trailing SL\n"
                  f"• T3: Book 25% of remaining quantity\n"
                  f"• Hold the balance until trailing SL or 90-trading-session time exit"
              )

              disclaimer = "Educational purposes only. Not investment advice. Verify prices and manage risk independently."
              formatted = []
              for index, line in enumerate(message_text.strip().splitlines()):
                  safe = html.escape(line)
                  if index == 0 or line.strip() in section_heads:
                      safe = f"<b>{safe}</b>"
                  elif ": " in line:
                      label, value = safe.split(": ", 1)
                      safe = f"<b>{label}:</b> <b>{value}</b>"
                  formatted.append(safe)
              telegram_text = "\n".join(formatted) + f"\n\n<i>⚠️ {html.escape(disclaimer)}</i>"

              result, outcome = post_message(telegram_text, chat_id)
              if outcome and outcome[0] == "migrate":
                  # Telegram group was upgraded; adopt Telegram's returned destination in memory.
                  chat_id = outcome[1]
                  print("Telegram chat migration detected; retrying this message using the updated destination.")
                  result, outcome = post_message(telegram_text, chat_id)

              if outcome:
                  failures.append(symbol + ": " + outcome[1])
              elif not result or not result.get("ok"):
                  failures.append(symbol + ": Telegram API did not confirm delivery")
              else:
                  message_id = result.get("result", {}).get("message_id")
                  print(f"TELEGRAM_DELIVERED symbol={symbol} message_id={message_id}")

          if failures:
              print("Telegram resend failures:")
              for failure in failures:
                  print(failure)
              raise SystemExit(1)

          print("Resend completed: all three entry messages accepted by Telegram.")
          PY
