name: ATH Monthly Alert 

on:
  push:
    branches: [main]
    paths:
      - monthly_ath.py
      - .github/workflows/ath-alert.yml
  schedule:
    # NSE hours 9:15-15:30 IST = 03:45-10:00 UTC, Mon-Fri, every 5 min
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore market-hours guard (testing)'
        type: boolean
        default: false

# never let two runs overlap or race on state.json
concurrency:
  group: ath-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python monthly_ath.py --force
          else
            python monthly_ath.py
          fi

      - name: Commit state (only if changed)
        run: |
          git config user.name  "ath-bot"
          git config user.email "ath-bot@users.noreply.github.com"
          git add state.json watchlist.json
          git diff --cached --quiet || (git commit -m "scan $(date -u +%F\ %H:%M) UTC" && git pull --rebase && git push)
