name: Monthly ATH Stock Backtest

on:
  push:
    branches: [main]
    paths:
      - "backtest_monthly_ath.py"
      - ".github/workflows/monthly-ath-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests
      - name: Run historical backtest
        run: python -u backtest_monthly_ath.py
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-ath-backtest-results
          path: |
            monthly_ath_backtest_trades.csv
            monthly_ath_backtest_summary.json
          if-no-files-found: warn
          retention-days: 30
