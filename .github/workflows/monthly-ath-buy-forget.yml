name: Monthly ATH Buy and Forget Backtest

on:
  push:
    branches: [main]
    paths:
      - "backtest_monthly_ath_buy_forget.py"
      - ".github/workflows/monthly-ath-buy-forget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buy-and-forget:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests
      - name: Run buy and forget backtest
        run: python -u backtest_monthly_ath_buy_forget.py
      - name: Upload buy and forget results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-ath-buy-forget-results
          path: |
            monthly_ath_buy_forget_summary.csv
            monthly_ath_buy_forget_summary.json
            monthly_ath_buy_forget_*m_trades.csv
          if-no-files-found: warn
          retention-days: 30
